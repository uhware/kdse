name: KDSE

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c11:
    name: C11 (${{ matrix.compiler }})
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        run: make test

  python:
    name: Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python reference package
        run: python -m pip install --disable-pip-version-check --no-deps ./kdse-python
      - name: Test Python and direct C parity
        env:
          KDSE_C_REFERENCE_ROOT: ${{ github.workspace }}
        run: python -m unittest discover -s kdse-python/tests -v
      - name: Smoke-test installed CLIs
        run: |
          kdse-py canonicalize 0b110
          kdse16-py compute 0x7fff --input 100 --threshold 1 --loss-percent 0
